<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to critical origins - do this early to reduce request chain -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.pravatar.cc" crossorigin />
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin />

    <!-- Preload LCP image (logo) with high priority -->
    <link rel="preload" href="/logo.png" as="image" fetchpriority="high" />

    <!-- Critical CSS inline - loads immediately without blocking, reduces chain length -->
    <style>
      /* Prevent layout shift by reserving space for header */
      nav{min-height:72px}
      /* Reserve space for main content */
      #root{min-height:100vh}
      /* System font fallback to prevent FOIT */
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0}
      /* Critical background color to prevent flash */
      html{background-color:#020617}
    </style>

    <!-- Meta tags - minimal set to reduce blocking -->
    <title>Eazybe - WhatsApp Sales Platform</title>
    <meta name="description" content="WhatsApp CRM integration for HubSpot, Zoho, Salesforce. Sync chats, schedule messages, and boost customer engagement." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#020617" />

    <!-- Preload critical assets with high priority - shortens critical path -->
    <link rel="preload" href="/index.css" as="style" />

    <!-- Defer non-critical resources to reduce initial chain -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Fonts - Use font-display swap and async loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"></noscript>

    <!-- Main CSS -->
    <link rel="stylesheet" href="/index.css">

    <!-- Defer non-critical resources -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Google Tag Manager - Fully deferred, does not block critical path -->
    <script>
      window.dataLayer=window.dataLayer||[];
      window.gtmLoaded=!1;
      function loadGTM(){
        if(window.gtmLoaded)return;
        window.gtmLoaded=!0;
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
        var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
        j.async=!0;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-K4C7HNNN');
      }
      'requestIdleCallback'in window?requestIdleCallback(loadGTM,{timeout:3000}):window.addEventListener('load',function(){setTimeout(loadGTM,100)});
    </script>
  </head>
  <body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4C7HNNN" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div id="root"></div>
    <!-- Defer non-critical script execution -->
    <script type="module" src="/index.tsx" defer></script>
  </body>
</html>
