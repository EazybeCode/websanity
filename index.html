    <!-- Critical CSS inlined for above-the-fold content -->

      /* Reset and base styles to prevent FOUC */
      html{background-color:#020617;color:#94A3B8}body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;font-family:Inter,system-ui,-apple-system,sans-serif}

      .text-5xl{font-size:3rem;line-height:1}.lg\:text-7xl{font-size:4.5rem;line-height:1}.font-extrabold{font-weight:800}.tracking-tight{letter-spacing:-0.025em}
      .text-white{--tw-text-opacity:1;color:rgb(255 255 255/var(--tw-text-opacity))}.bg-slate-950{--tw-bg-opacity:1;background-color:rgb(2 6 23/var(--tw-bg-opacity))}
      .text-transparent{color:transparent}.bg-clip-text{-webkit-background-clip:text;background-clip:text}
      .bg-gradient-to-r{background-image:linear-gradient(to right,var(--tw-gradient-stops))}
      .from-cyan-400{--tw-gradient-from:#22d3ee;--tw-gradient-to:rgb(34 211 238 / 0);--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)}
      .via-blue-500{--tw-gradient-to:rgb(59 130 246 / 0);--tw-gradient-stops:var(--tw-gradient-from),#3b82f6,var(--tw-gradient-to)}
      .to-emerald-400{--tw-gradient-to:#34d399}
      .mb-8{margin-bottom:2rem}.gap-16{gap:4rem}.items-center{align-items:center}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
      @media (min-width:1024px){.lg\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
      /* Fix header visibility during load */
      nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(2,6,23,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.05)}
      /* Loading skeleton for hero to reduce perceived latency */
      .hero-loading{min-height:600px;display:flex;align-items:center}

// Load GTM AFTER page is fully loaded (not just DOMContentLoaded)
// This prevents GTM from blocking LCP and INP
function scheduleGTM() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleGTM);
    return;
  }

  // Wait for idle time OR max 3 second wait after page load
  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadGTM, { timeout: 3000 });
  } else {
    // Fallback for browsers without requestIdleCallback
    window.addEventListener('load', function() {
      setTimeout(loadGTM, 2000);
    });
  }
}

scheduleGTM();
</script>
