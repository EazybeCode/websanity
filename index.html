<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="origin-when-cross-origin" />

    <!-- Preconnect to critical origins for faster connection -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Preload critical CSS - highest priority -->
    <link rel="preload" href="/index.css" as="style" />

    <!-- Preload logo image -->
    <link rel="preload" href="/logo.png" as="image" type="image/png" fetchpriority="high" />

    <!-- Basic Meta Tags -->
    <title>Eazybe - WhatsApp Sales Platform</title>
    <meta name="robots" content="index, follow" />
    <!-- All SEO meta tags and JSON-LD schemas are added dynamically by respective page components -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#020617" />

    <!-- Google Fonts - Optimized loading with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Main CSS (includes Tailwind compiled at build time) -->
    <link rel="stylesheet" href="/index.css">

    <!-- Critical CSS to prevent CLS and FOUC -->
    <style>
      /* Hide content until fonts load (prevents FOUC) */
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      #root { min-height: 100vh; }
      /* Reserve header space to prevent CLS */
      nav { min-height: 72px; }
      /* Base styles to prevent layout shift */
      html { scroll-behavior: smooth; }
      body { margin: 0; padding: 0; overflow-x: hidden; }
      /* Reduce motion for users who prefer it */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

<!-- Google Tag Manager - Fully deferred to not block LCP -->
<script>
  window.dataLayer = window.dataLayer || [];
  function loadGTM() {

    window.gtmLoaded = true;

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-K4C7HNNN');
  }
  // Load GTM after page is fully visible (doesn't block LCP)
  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadGTM, { timeout: 5000 });
  } else {
    window.addEventListener('load', () => setTimeout(loadGTM, 500));
  }
</script>
<!-- End Google Tag Manager -->
</head>
  <body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4C7HNNN"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

    <script type="module" src="/index.tsx"></script>

</html>
