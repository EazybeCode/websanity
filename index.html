    <!-- Main CSS (includes Tailwind compiled at build time) -->
    <link rel="stylesheet" href="/index.css">

    <!-- Critical CSS for above-the-fold content to prevent layout shift -->
    <style>
      /* Prevent layout shift by reserving space for header */
      nav {
        min-height: 72px;
      }
      /* Reserve space for main content to prevent CLS */
      #root {
        min-height: 100vh;
      }
      /* Prevent font flash */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* Smooth transitions for theme changes */
      *, *::before, *::after {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }
    </style>
