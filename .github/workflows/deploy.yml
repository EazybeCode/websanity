name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "==> Pulling latest main"
            git fetch origin main
            git reset --hard origin/main
            echo "==> Refreshing SANITY_API_TOKEN in .env"
            if [ -n "${{ secrets.SANITY_API_TOKEN_PROD }}" ]; then
              sed -i '/^SANITY_API_TOKEN=/d' .env
              printf 'SANITY_API_TOKEN=%s\n' "${{ secrets.SANITY_API_TOKEN_PROD }}" >> .env
              echo "==> Token refreshed"
            else
              echo "==> SANITY_API_TOKEN_PROD secret not set; leaving .env unchanged"
            fi
            echo "==> Running deploy.sh"
            ./deploy.sh
            echo "==> Deploy finished"
