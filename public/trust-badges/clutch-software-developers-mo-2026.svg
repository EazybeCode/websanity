  </g>
  <!-- Separator ticks flanking the band -->
  <line x1="72" y1="87" x2="148" y2="87" stroke="#d0d4d9" stroke-width="1.5"/>
  <line x1="72" y1="126" x2="148" y2="126" stroke="#d0d4d9" stroke-width="1.5"/>
