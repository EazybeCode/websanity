server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;
    gzip_comp_level 6;

    # Enable Brotli compression (if available)
    # brotli on;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 301 Redirects
    # Integration URL redirects
    rewrite ^/integrations/zoho-crm$ /zoho-whatsapp-integration permanent;
    rewrite ^/zoho-crm$ /zoho-whatsapp-integration permanent;
    rewrite ^/integrations/hubspot$ /hubspot-whatsapp-integration permanent;
    rewrite ^/hubspot$ /hubspot-whatsapp-integration permanent;
    # Portuguese blog redirects
    rewrite ^/br/blog/unlock-productivity-with-tasks-hubspot-whatsapp-integration$ /br/hubspot-whatsapp-integration permanent;
    rewrite ^/br/blog/integrate-hubspot-with-whatsapp-easiest-method$ /br permanent;
    # Fix /index.html SEO issue - redirect to root
    rewrite ^/index\.html$ / permanent;

    # HTML files - short cache (revalidate often)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Hashed assets (with content hash) - immutable, cache for 1 year
    location ~* ^/assets/.*-[a-f0-9]{8,}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images - cache for 1 year (immutable)
    location ~* \.(png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SVG files - cache for 1 year
    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fonts - cache for 1 year (immutable)
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files - cache for 1 year
    location ~* \.(mp4|webm|mp3|ogg|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon and app icons
    location ~* \.(favicon|apple-touch-icon|manifest|browserconfig)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sitemap and robots
    location ~* (sitemap|robots)\.(xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Default location
    location / {
        # Try file first, then directory, then 404 if not found
        try_files $uri $uri/index.html $uri/ =404;

        # Default cache for other files
        expires 1h;
        add_header Cache-Control "public, must-revalidate";

        # Content-Language header for English (default)
        add_header Content-Language "en" always;
    }

    # Brazilian Portuguese routes
    location ^~ /br/ {
        try_files $uri $uri/index.html $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Language "pt-BR" always;
    }

    # Spanish routes
    location ^~ /es/ {
        try_files $uri $uri/index.html $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Language "es" always;
    }

    # Turkish routes
    location ^~ /tr/ {
        try_files $uri $uri/index.html $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Language "tr" always;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
